<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* 🛠️ [مكان التعديل]: الحاوية العامة للموقع */
    .app-main {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding-bottom: 60px; /* مسافة لكي لا يغطي شريط الكتابة الثابت المحتوى تحته */
    }

    /* 🛠️ [مكان التعديل 1]: منطقة الإعلانات العلوية (ارتفاع الإعلان) */
    .ad-section {
      width: 100%;
      min-height: 75px; /* يمكنك تغيير ارتفاع الإعلان هنا */
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 🛠️ [مكان التعديل 2]: منطقة شاشة البث والمسافات حولها */
    .stream-section {
      width: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 10px; /* المسافة الفوقية والتحتية لشاشة البث (قلل الرقم لتقليل الفراغ) */
    }

    .stream-box {
      width: 100%;
      max-width: 480px; /* أقصى عرض لشاشة البث */
      aspect-ratio: 16 / 9; /* أبعاد البث 16:9 */
      background-color: #050505;
      position: relative;
    }

    .stream-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 🛠️ [مكان التعديل 3]: منطقة التعليقات */
    .chat-section {
      width: 100%;
      background-color: #0a0a0a;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px;
      min-height: 100px; /* ارتفاع مساحة ظهور التعليقات */
    }

    .comments-box {
      width: 100%;
      font-size: 13px; /* حجم خط التعليقات */
      color: #eee;
    }

    .comment-line {
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .comment-line strong {
      color: #a29bfe;
    }

    /* 🛠️ [مكان التعديل 4]: شريط الكتابة الثابت في أస్فل الشاشة دائماً */
    .input-section {
      position: fixed; /* تثبيت الشريط أسفل الشاشة تماماً */
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55px; /* ارتفاع شريط الكتابة */
      background-color: #161616;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 9999; /* لضمان ظهوره فوق كل العناصر */
      padding-bottom: env(safe-area-inset-bottom);
    }

    .input-section input {
      flex: 1;
      height: 38px;
      background-color: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 0 15px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .input-section input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .input-section button {
      height: 38px;
      background-color: #6c5ce7; /* لون زر الإرسال */
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-main">
    
    <!-- 1. الإعلان العلوي -->
    <div class="ad-section" id="ad-box"></div>

    <!-- 2. شاشة البث المباشر -->
    <div class="stream-section">
      <div class="stream-box">
        <iframe 
          src="https://player.twitch.tv/?channel=1stremer_1&parent=galive11.github.io" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 3. منطقة التعليقات -->
    <div class="chat-section">
      <div class="comments-box" id="commentsBox">
        <div class="comment-line"><strong>متابع:</strong> أهلاً بك في البث المباشر!</div>
      </div>
    </div>

  </div>

  <!-- 4. شريط الكتابة الثابت في أسفل الشاشة -->
  <div class="input-section">
    <input type="text" id="userInput" placeholder="اكتب تعليقك أو اسم الستريمر هنا...">
    <button onclick="sendMsg()">إرسال</button>
  </div>

  <script>
    // تفعيل التليجرام الـ WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // رابط الإعلان المباشر عند الضغط (Direct Link)
    const DIRECT_AD_LINK = "https://www.highrevenuegate.com/YOUR_DIRECT_LINK_ID";
    let adOpened = false;

    function sendMsg() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();

      if (text !== "") {
        if (!adOpened && DIRECT_AD_LINK.includes("http")) {
          window.open(DIRECT_AD_LINK, '_blank');
          adOpened = true;
        }

        const box = document.getElementById("commentsBox");
        const msg = document.createElement("div");
        msg.className = "comment-line";
        msg.innerHTML = `<strong>أنت:</strong> ${text}`;
        box.appendChild(msg);
        window.scrollTo(0, document.body.scrollHeight);

        input.value = "";
      }
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMsg();
      }
    });

    // --- كود تدوير الإعلانات العلوية ---
    const adScripts = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let adIndex = 0;

    function loadNextAd() {
      const adBox = document.getElementById("ad-box");
      if (!adBox) return;

      adBox.innerHTML = "";

      const s = document.createElement("script");
      s.type = "text/javascript";
      s.src = adScripts[adIndex];
      s.async = true;
      s.setAttribute("data-cfasync", "false");

      adBox.appendChild(s);
      adIndex = (adIndex + 1) % adScripts.length;
    }

    window.onload = function() {
      loadNextAd();
      setInterval(loadNextAd, 20000);
    };
  </script>

</body>
</html>
