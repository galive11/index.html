<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #0d0f12; overflow: hidden; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; }

    /* مشغل البث (Twitch Player) */
    #player-container {
      width: 100%;
      height: 40vh;
      position: relative;
      background: #000;
      flex-shrink: 0;
    }

    /* حاوية الدردشة المباشرة (Twitch Chat) */
    #chat-container {
      flex: 1;
      width: 100%;
      background: #181a20;
      border-top: 1px solid #2b2f3a;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- مشغل البث (Twitch Player) -->
  <div id="player-container">
    <iframe 
      id="twitch-player" 
      allowfullscreen="true" 
      scrolling="no"
      allow="autoplay; fullscreen; encrypted-media">
    </iframe>
  </div>

  <!-- صندوق التعليقات والدردشة المباشرة (Twitch Chat) -->
  <div id="chat-container">
    <iframe 
      id="twitch-chat"
      scrolling="no">
    </iframe>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // إعداد مشغل وتصميم دردشة تويتش
    const urlParams = new URLSearchParams(window.location.search);
    const streamer = (urlParams.get('startapp') || urlParams.get('streamer') || '1stremer_1').toLowerCase().trim();
    
    // رابط البث مع وضع latency=low لسرعة التشغيل
    const playerFrame = document.getElementById('twitch-player');
    playerFrame.src = `https://player.twitch.tv/?channel=${streamer}&parent=galive11.github.io&parent=telegram.org&parent=web.telegram.org&autoplay=true&muted=false&latency=low`;

    // رابط الشات المباشر المربوط بـ Twitch
    const chatFrame = document.getElementById('twitch-chat');
    chatFrame.src = `https://www.twitch.tv/embed/${streamer}/chat?parent=galive11.github.io&parent=telegram.org&parent=web.telegram.org&darkpopout`;

    // --- مصفوفة روابط سكريبتات الـ Social Bar لربط الخمس وحدات ---
    const socialBarScripts = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd", // الكود الأول الخاص بك
      // "ضع رابط الكود الثاني هنا",
      // "ضع رابط الكود الثالث هنا",
      // "ضع رابط الكود الرابع هنا",
      // "ضع رابط الكود الخامس هنا"
    ];

    let currentScriptIndex = 0;

    function rotateSocialBar() {
      // إزالة سكريبت Social Bar القديم إن وجد
      const oldScript = document.getElementById('active-social-bar');
      if (oldScript) {
        oldScript.remove();
      }

      // إنشاء وتحميل سكريبت Social Bar الجديد
      const newScript = document.createElement('script');
      newScript.id = 'active-social-bar';
      newScript.setAttribute('data-cfasync', 'false');
      newScript.src = socialBarScripts[currentScriptIndex];

      document.body.appendChild(newScript);

      // الانتقال للوحدة التالية بالترتيب
      currentScriptIndex = (currentScriptIndex + 1) % socialBarScripts.length;
    }

    // التشغيل الأول والتبديل التلقائي كل 12 ثانية
    rotateSocialBar();
    setInterval(rotateSocialBar, 12000); // 12000 ملي ثانية = 12 ثانية
  </script>

</body>
</html>
