<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    .app-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. الإعلانات العلوية */
    .ad-top-dock {
      width: 100%;
      height: 75px;
      background-color: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 2. شاشة البث (سحبها لأسفل قليلاً لمنتصف الشاشة) */
    .stream-container {
      width: 100%;
      margin-top: 25px;
      display: flex;
      justify-content: center;
      padding: 0 10px;
    }

    .stream-content-box {
      width: 100%;
      max-width: 450px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      position: relative;
    }

    .stream-content-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 3. صندوق التعليقات (مصغر جداً ليناسب المساحة) */
    .chat-container {
      width: 100%;
      height: 110px;
      margin-top: 10px;
      overflow-y: auto;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: #000;
    }

    .chat-bubble {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      max-width: 85%;
      align-self: flex-start;
      word-break: break-word;
    }

    /* 4. بار الكتابة (مثبت بالأسفل تماماً بـ Fixed لتفادي الاختفاء) */
    .input-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55px;
      padding: 8px 12px;
      background-color: #121212;
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 100;
    }

    .input-bar input {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .input-bar input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .input-bar button {
      background-color: #6c5ce7; 
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- 1. حاوية الإعلانات -->
    <div class="ad-top-dock" id="ad-container"></div>

    <!-- 2. شاشة البث المباشر -->
    <div class="stream-container">
      <div class="stream-content-box">
        <iframe 
          src="https://player.twitch.tv/?channel=1stremer_1&parent=galive11.github.io" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 3. صندوق التعليقات المصغر -->
    <div class="chat-container" id="chatBox"></div>

    <!-- 4. حقل الكتابة المثبت بالأسفل -->
    <div class="input-bar">
      <input type="text" id="messageInput" placeholder="اكتب تعليقاً...">
      <button onclick="sendMessage()">إرسال</button>
    </div>

  </div>

  <script>
    const tele = window.Telegram.WebApp;
    tele.ready();
    tele.expand();

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chatBox = document.getElementById("chatBox");
      
      if (input.value.trim() !== "") {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.innerHTML = `<strong>أنت:</strong> ${input.value}`;
        chatBox.appendChild(bubble);
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    // --- كود تدوير الإعلانات ---
    const adUnits = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let currentIndex = 0;

    function rotateAds() {
      const container = document.getElementById("ad-container");
      if (!container) return;

      container.innerHTML = "";

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = adUnits[currentIndex];
      script.async = true;
      script.setAttribute("data-cfasync", "false");

      container.appendChild(script);

      currentIndex = (currentIndex + 1) % adUnits.length;
    }

    window.addEventListener('load', rotateAds);
    setInterval(rotateAds, 20000);
  </script>

</body>
</html>
