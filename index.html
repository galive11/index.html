<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة البث المباشر</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      margin: 0; padding: 0; background-color: #0d1117; color: #fff;
      font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; min-height: 100vh;
    }
    header {
      width: 100%; background: #161b22; padding: 12px 0; text-align: center;
      border-bottom: 1px solid #30363d; font-weight: bold; font-size: 16px;
    }
    #video-container {
      width: 100%; max-width: 800px; flex-grow: 1; display: flex;
      flex-direction: column; align-items: center; justify-content: center; padding: 10px;
    }
    video { width: 100%; height: auto; max-height: 70vh; border-radius: 8px; background: #000; }
    #ad-container {
      width: 100%; min-height: 65px; background: #161b22; display: flex;
      align-items: center; justify-content: center; border-top: 1px solid #30363d;
    }
    .streamer-info { margin-top: 10px; color: #58a6ff; font-size: 14px; }
  </style>
</head>
<body>

  <header>📺 بث مباشر - المذيع: <span id="streamer-name">جاري التحميل...</span></header>

  <div id="video-container">
    <video id="video" controls autoplay muted></video>
    <div class="streamer-info" id="streamer-status">جاري الاتصال بالبث...</div>
  </div>

  <!-- حاوية الإعلان المتجدد تلقائياً -->
  <div id="ad-container"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const streamerUsername = urlParams.get('streamer') || 'default';
    const streamUrl = urlParams.get('url') || '';

    document.getElementById('streamer-name').innerText = '@' + streamerUsername;

    // 1. تشغيل بث HLS
    const video = document.getElementById('video');
    if (streamUrl) {
      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
      }
      document.getElementById('streamer-status').innerText = '🔴 البث مباشر الآن';
    } else {
      document.getElementById('streamer-status').innerText = '⚠️ لا يوجد بث نشط حالياً لهذا الستريمر.';
    }

    // 2. تحديث إعلان Adsterra الخاص بك أوتوماتيكياً كل 15 ثانية مع تتبع الأرباح برمز subid
    function refreshAd() {
      const adContainer = document.getElementById('ad-container');
      adContainer.innerHTML = ''; 

      const script = document.createElement('script');
      script.setAttribute('data-cfasync', 'false');
      // تم الدمج مع رابط السكريبت الخاص بك وإضافة معلمة التتبع للستريمر
      script.src = `https://bicea.org/14/664c4c28023577c68e9439b9764e7610?subid=${streamerUsername}&rand=` + Math.random();
      script.async = true;
      adContainer.appendChild(script);
    }

    refreshAd();
    setInterval(refreshAd, 15000); // تحديث الإعلان كل 15 ثانية
  </script>
</body>
</html>
