<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* إزالة الهوامش الافتراضية وثبيت الشاشة */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    /* الحاوية الرئيسية بنظام Flex عمودي */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* 1. منطقة الإعلانات في الأعلى */
    .ad-top-dock {
      flex: 0 0 auto;
      width: 100%;
      min-height: 80px;
      background-color: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 2. منطقة البث المباشر - في الوسط */
    .stream-container {
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-color: #000;
    }

    /* مستطيل شاشة اللايف */
    .stream-content-box {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      position: relative;
    }

    .stream-content-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 3. منطقة التعليقات */
    .chat-container {
      flex: 0 0 25%;
      width: 100%;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #000;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-bubble {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
      max-width: 90%;
      align-self: flex-start;
    }

    /* 4. بار الكتابة والإرسال */
    .input-bar {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px 15px;
      background-color: #121212;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    .input-bar input {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 10px 15px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-bar input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .input-bar button {
      background-color: #6c5ce7; 
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- 1. حاوية الإعلانات العلوية -->
    <div class="ad-top-dock" id="ad-container"></div>

    <!-- 2. منطقة البث المباشر (في الوسط) -->
    <div class="stream-container">
      <div class="stream-content-box">
        <iframe 
          src="https://player.twitch.tv/?channel=1stremer_1&parent=galive11.github.io" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 3. منطقة التعليقات -->
    <div class="chat-container" id="chatBox">
      <div class="chat-bubble"><strong>علي:</strong> منورين الشباب، أحلى بث!</div>
      <div class="chat-bubble"><strong>محمد:</strong> الصوت والصورة كلش واضحين</div>
    </div>

    <!-- 4. بار الكتابة -->
    <div class="input-bar">
      <input type="text" id="messageInput" placeholder="اكتب تعليقاً...">
      <button onclick="sendMessage()">إرسال</button>
    </div>

  </div>

    tele.ready();
    tele.expand();

      const chatBox = document.getElementById("chatBox");
