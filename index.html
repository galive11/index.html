<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #ad-container {
      width: 100%;
      height: 80px;
      background: #181a20;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      border-bottom: 1px solid #2b2f3a;
    }
    #player-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 80px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 1. حاوية الإعلانات (Adsterra) -->
  <div id="ad-container">
    <!-- ضع كود إعلانات Adsterra المتجدد هنا -->
  </div>

  <!-- 2. حاوية مشغل البث -->
  <div id="player-container">
    <iframe 
      id="kick-player" 
      allowfullscreen="true" 
      scrolling="no"
      referrerpolicy="no-referrer-when-downgrade"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
      allow="autoplay; fullscreen; encrypted-media">
    </iframe>
  </div>

  <script>
    // 1. تهيئة تطبيق تلجرام
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // 2. جلب اسم القناة وتنسيقه
    const urlParams = new URLSearchParams(window.location.search);
    const streamer = (urlParams.get('streamer') || '1stremer_1').toLowerCase().trim();

    // 3. بناء رابط التضمين المتوافق مع حماية Kick في الهواتف
    const playerFrame = document.getElementById('kick-player');
    
    // استخدام الدومين المباشر الخاص بجيت هاب مع كسر قيود الأوريجن
    const embedUrl = `https://player.kick.com/${streamer}?parent=galive11.github.io&autoplay=true&muted=false`;
    
    playerFrame.src = embedUrl;
  </script>

</body>
</html>
