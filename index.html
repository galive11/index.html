<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* إزالة الهوامش الافتراضية وتثبيت الشاشة بالكامل */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
    }

    /* الحاوية الرئيسية لتقسيم الشاشة عمودياً */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* 1. قسم مشغل البث المباشر (أبعاد 16:9 في الأعلى) */
    .stream-container {
      flex: 0 0 auto;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
    }

    .stream-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 2. قسم الشات والتعليقات (في الوسط مع تمرير داخلي) */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #1a1a1a;
    }

    .chat-bubble {
      background-color: rgba(255, 255, 255, 0.07);
      padding: 8px 12px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      max-width: 85%;
    }

    /* 3. شريط الإعلان السفلي الثابت (مساحة مخصصة وآمنة) */
    .ad-zone-dock {
      flex: 0 0 75px;
      width: 100%;
      background-color: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 999;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- 1. شاشة البث المباشر -->
    <div class="stream-container">
      <iframe src="https://www.youtube.com/embed/LIVE_STREAM_ID" allowfullscreen></iframe>
    </div>

    <!-- 2. قسم الشات والتفاعل -->
    <div class="chat-container" id="chatBox">
      <div class="chat-bubble"><strong>علي:</strong> منورين الشباب، أحلى بث!</div>
      <div class="chat-bubble"><strong>محمد:</strong> الصوت والصورة كلش واضحين</div>
    </div>

    <!-- 3. حاوية الإعلان السفلي (يتم تدوير الوحدات الـ 6 فيها تلقائياً) -->
    <div class="ad-zone-dock" id="ad-container"></div>

  </div>

  <script>
    // روابط الـ 6 وحدات Social Bar المستقلة
    const adUnits = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let currentIndex = 0;

    function rotateSocialBar() {
      const container = document.getElementById("ad-container");
      
      if (!container) return;

      // أ) تنظيف الحاوية وحذف السكريبت القديم نهائياً من الـ DOM لمنع تراكم الذاكرة
      while (container.firstChild) {
        container.removeChild(container.firstChild);
      }

      // ب) إنشاء عنصر script جديد كلياً
      const newScript = document.createElement("script");
      newScript.type = "text/javascript";
      newScript.src = adUnits[currentIndex];
      newScript.async = true;
      newScript.setAttribute("data-cfasync", "false");

      // ج) حقن السكريبت الجديد داخل حاوية الشريط السفلي
      container.appendChild(newScript);

      // د) الانتقال للوحدة التالية (والعودة للأولى تلقائياً بعد اكتمال الـ 6 وحدات)
      currentIndex = (currentIndex + 1) % adUnits.length;
    }

    // تشغيل أول وحدة فور فتح التطبيق
    rotateSocialBar();

    // التبديل الدقيق والمنتظم كل 20 ثانية لتكتمل الدورة في دقيقتين (20,000 مللي ثانية)
    setInterval(rotateSocialBar, 20000);
  </script>

</body>
</html>
