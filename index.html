<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #ad-container {
      width: 100%;
      height: 50px; /* أصغر حجم قياسي وآمن للإعلانات لا يؤثر على المحتوى */
      background: #181a20;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      overflow: hidden;
    }
    #player-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 50px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 1. حاوية الإعلان بحجم صغير جداً ومتجدد -->
  <div id="ad-container">
    <div id="ad-slot" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">
      <script id="ad-script" data-cfasync="false" src="https://bicea.org/14/664c4c28023577c68e9439b9764e7610"></script>
    </div>
  </div>

  <!-- 2. حاوية مشغل البث (Twitch) بمساحة الشاشة الكاملة المتبقية -->
  <div id="player-container">
    <iframe 
      id="twitch-player" 
      allowfullscreen="true" 
      scrolling="no"
      allow="autoplay; fullscreen; encrypted-media">
    </iframe>
  </div>

  <script>
    // تهيئة تطبيق تلجرام
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // جلب اسم القناة من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const streamer = (urlParams.get('startapp') || urlParams.get('streamer') || '1stremer_1').toLowerCase().trim();

    // إعداد مشغل Twitch
    const playerFrame = document.getElementById('twitch-player');
    const embedUrl = `https://player.twitch.tv/?channel=${streamer}&parent=galive11.github.io&parent=telegram.org&parent=web.telegram.org&autoplay=true&muted=false`;
    playerFrame.src = embedUrl;

    // --- نظام التجديد التلقائي للإعلانات كل 20 ثانية للحفاظ على الأرباح ---
    setInterval(function() {
      const adSlot = document.getElementById('ad-slot');
      if (adSlot) {
        adSlot.innerHTML = '';
        const newScript = document.createElement('script');
        newScript.setAttribute('data-cfasync', 'false');
        newScript.src = "https://bicea.org/14/664c4c28023577c68e9439b9764e7610?t=" + new Date().getTime();
        adSlot.appendChild(newScript);
      }
    }, 20000); // يتجدد كل 20 ثانية تلقائياً
  </script>

</body>
</html>
