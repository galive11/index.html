<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      justify-content: space-between;
      position: relative;
    }

    /* 1. حاوية الإعلانات العلوية */
    .ad-top-dock {
      flex: 0 0 75px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 2. شاشة البث - تم رفعها للأعلى بنسبة 10% */
    .stream-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 10px;
      transform: translateY(-10%); /* رفع البث للأعلى بنسبة 10% */
    }

    .stream-content-box {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      position: relative;
    }

    .stream-content-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 3. منطقة التعليقات ومستطيل الكتابة (تم تصغير المساحة 50%) */
    .chat-section {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    /* مكان التعاليق المصغر بنسبة 50% */
    .comments-list {
      height: 50px; /* تصغير ارتفاع مساحة التعاليق */
      overflow-y: auto;
      padding: 5px 12px;
      font-size: 11px;
      color: #ccc;
    }

    .comment-item {
      margin-bottom: 3px;
    }

    .comment-item span {
      font-weight: bold;
      color: #a29bfe;
    }

    /* خانة الكتابة */
    .input-bar {
      height: 45px;
      padding: 5px 10px;
      background-color: #151515;
      display: flex;
      gap: 6px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .input-bar input {
      flex: 1;
      height: 32px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 0 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .input-bar input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .input-bar button {
      height: 32px;
      background-color: #6c5ce7; 
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- 1. حاوية الإعلانات العلوية -->
    <div class="ad-top-dock" id="ad-container"></div>

    <!-- 2. منطقة البث (مرفوعة للأعلى بنسبة 10%) -->
    <div class="stream-container">
      <div class="stream-content-box">
        <iframe 
          src="https://player.twitch.tv/?channel=1stremer_1&parent=galive11.github.io" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 3. منطقة التعليقات المصغرة وخانة الكتابة -->
    <div class="chat-section">
      <div class="comments-list" id="commentsList">
        <div class="comment-item"><span>متابع:</span> أهلاً بالجميع في البث!</div>
      </div>
      <div class="input-bar">
        <input type="text" id="messageInput" placeholder="اكتب اسم الستريمر أو التعليق...">
        <button onclick="handleSend()">إرسال</button>
      </div>
    </div>

  </div>

  <script>
    const tele = window.Telegram.WebApp;
    tele.ready();
    tele.expand();

    // رابط الإعلان المباشر (Direct Link / Smart Link)
    // استبدل هذا الرابط برابط Direct Link الخاص بك من Adsterra
    const DIRECT_AD_LINK = "https://www.highrevenuegate.com/YOUR_DIRECT_LINK_ID";
    let hasClickedAd = false;

    function handleSend() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      
      if (text !== "") {
        // إذا لم ينقر المستخدم على الإعلان من قبل، نفتح الإعلان المباشر مرة واحدة فقط لعدم الإزعاج
        if (!hasClickedAd && DIRECT_AD_LINK.includes("http")) {
          window.open(DIRECT_AD_LINK, '_blank');
          hasClickedAd = true; // تثبيت أنه فتح الإعلان ولن يزعجه مرة أخرى
        }

        // إضافة التعليق للشاشة
        const commentsList = document.getElementById("commentsList");
        const newComment = document.createElement("div");
        newComment.className = "comment-item";
        newComment.innerHTML = `<span>أنت:</span> ${text}`;
        commentsList.appendChild(newComment);
        commentsList.scrollTop = commentsList.scrollHeight;

        input.value = "";
      }
    }

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        handleSend();
      }
    });

    // --- كود تدوير الإعلانات العلوية ---
    const adUnits = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let currentIndex = 0;

    function rotateAds() {
      const container = document.getElementById("ad-container");
      if (!container) return;

      container.innerHTML = "";

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = adUnits[currentIndex];
      script.async = true;
      script.setAttribute("data-cfasync", "false");

      container.appendChild(script);

      currentIndex = (currentIndex + 1) % adUnits.length;
    }

    window.addEventListener('load', rotateAds);
    setInterval(rotateAds, 20000);
  </script>

</body>
</html>
