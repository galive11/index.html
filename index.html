<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">بثوث مباشرة جيلوكا</title>
  
  <!-- 🖼️ وسوم المعاينة الديناميكية (تتغير تلقائياً حسب اللعبة والستريمر) -->
  <meta property="og:title" id="ogTitle" content="🔴 بث مباشر الآن - جيلوكا">
  <meta property="og:description" id="ogDesc" content="انضم الآن لمشاهدة البث المباشر والتفاعل معنا مباشرة.">
  <meta property="og:image" id="ogImage" content="https://galive11.github.io/default-banner.jpg">
  <meta property="og:url" id="ogUrl" content="https://galive11.github.io">
  <meta property="og:type" content="website">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      justify-content: space-between;
      position: relative;
    }

    /* 1. حاوية الإعلانات العلوية */
    .ad-top-dock {
      flex: 0 0 65px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* شريط اختيار الستريمر والألعاب */
    .streamers-bar {
      width: 100%;
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      background-color: #080808;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .streamer-btn {
      background-color: #222;
      color: #aaa;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 11px;
      cursor: pointer;
      transition: 0.2s;
    }

    .streamer-btn.active {
      background-color: #6c5ce7;
      color: #fff;
      border-color: #6c5ce7;
      font-weight: bold;
    }

    /* 2. شاشة البث */
    .stream-container {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 10px;
      transform: translateY(-5%);
    }

    .stream-content-box {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      position: relative;
    }

    .stream-content-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* زر مشاركة رابط البث مع صورة اللعبة */
    .share-stream-btn {
      margin-top: 10px;
      background-color: #27ae60;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 3. منطقة التعليقات ومستطيل الكتابة */
    .chat-section {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #0d0d0d;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    .comments-list {
      height: 45px;
      overflow-y: auto;
      padding: 4px 12px;
      font-size: 11px;
      color: #ccc;
    }

    .comment-item {
      margin-bottom: 2px;
    }

    .comment-item span {
      font-weight: bold;
      color: #a29bfe;
    }

    /* خانة الكتابة */
    .input-bar {
      height: 45px;
      padding: 5px 10px;
      background-color: #151515;
      display: flex;
      gap: 6px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .input-bar input {
      flex: 1;
      height: 32px;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 0 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .input-bar input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .input-bar button {
      height: 32px;
      background-color: #6c5ce7; 
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- 1. حاوية الإعلانات العلوية -->
    <div class="ad-top-dock" id="ad-container"></div>

    <!-- شريط اختيار الستريمر والألعاب -->
    <div class="streamers-bar" id="streamersBar"></div>

    <!-- 2. منطقة البث -->
    <div class="stream-container">
      <div class="stream-content-box">
        <iframe id="streamIframe" src="" allowfullscreen></iframe>
      </div>
      <!-- زر المشاركة الخاصة بالستريمر الحالي -->
      <button class="share-stream-btn" onclick="shareCurrentStream()">
        📤 مشاركة البث (مع صورة اللعبة)
      </button>
    </div>

    <!-- 3. منطقة التعليقات المصغرة وخانة الكتابة -->
    <div class="chat-section">
      <div class="comments-list" id="commentsList">
        <div class="comment-item"><span>متابع:</span> أهلاً بالجميع في البث المباشر!</div>
      </div>
      <div class="input-bar">
        <input type="text" id="messageInput" placeholder="اكتب تعليقك هنا...">
        <button onclick="handleSend()">إرسال</button>
      </div>
    </div>

  </div>

  <script>
    const tele = window.Telegram.WebApp;
    tele.ready();
    tele.expand();

    // --- قائمة الستريمرز وروابط الصور الخاصة بكل لعبة ---
    const streamersList = [
      { 
        name: "أحمد (PUBG)", 
        channel: "1stremer_1", 
        game: "PUBG Mobile", 
        image: "https://share.google/PjlmFNc4Xatkc1e9z", // صورة ببجي المرفقة
        title: "🏆 بث مباشر PUBG Mobile - انضم للبث الآن!" 
      },
      { 
        name: "خالد (CoD MW)", 
        channel: "2stremer_2", 
        game: "Call of Duty", 
        image: "https://share.google/vdjtFIrgdtxkU8bSe", // صورة كود المرفقة
        title: "🔥 بث مباشر Call of Duty - الأكشن بدأ الآن!" 
      },
      { 
        name: "سعد (PUBG)", 
        channel: "3stremer_3", 
        game: "PUBG Mobile", 
        image: "https://share.google/PjlmFNc4Xatkc1e9z", 
        title: "🏆 بث مباشر PUBG Mobile - تحديات قوية وحماس!" 
      },
      { 
        name: "فيصل (CoD MW)", 
        channel: "4stremer_4", 
        game: "Call of Duty", 
        image: "https://share.google/vdjtFIrgdtxkU8bSe", 
        title: "🔥 بث مباشر Call of Duty - معارك نارية مباشرة!" 
      }
    ];

    // قراءة الستريمر من الرابط إن وجد
    const urlParams = new URLSearchParams(window.location.search);
    const targetChannel = urlParams.get('stream');
    let activeStreamer = streamersList[0];

    if (targetChannel) {
      const found = streamersList.find(s => s.channel === targetChannel);
      if (found) activeStreamer = found;
    }

    function initPage() {
      const bar = document.getElementById("streamersBar");
      bar.innerHTML = "";

      streamersList.forEach((streamer) => {
        const btn = document.createElement("button");
        btn.className = `streamer-btn ${streamer.channel === activeStreamer.channel ? 'active' : ''}`;
        btn.innerText = streamer.name;
        btn.onclick = () => {
          const newUrl = `${window.location.pathname}?stream=${streamer.channel}`;
          window.history.pushState({path: newUrl}, '', newUrl);
          activeStreamer = streamer;
          updateStreamView();
        };
        bar.appendChild(btn);
      });

      updateStreamView();
    }

    function updateStreamView() {
      const iframe = document.getElementById("streamIframe");
      iframe.src = `https://player.twitch.tv/?channel=${activeStreamer.channel}&parent=galive11.github.io`;

      // تحديث وسوم المعاينة (Open Graph) ديناميكياً لتطابق اللعبة الحالية
      document.getElementById("ogTitle").setAttribute("content", activeStreamer.title);
      document.getElementById("ogImage").setAttribute("content", activeStreamer.image);
      document.getElementById("ogDesc").setAttribute("content", `🔴 البث شغال الآن مع ${activeStreamer.name}! انضم وشاهد اللعب المباشر.`);
      document.getElementById("pageTitle").innerText = activeStreamer.title;

      document.querySelectorAll('.streamer-btn').forEach(b => {
        if(b.innerText.includes(activeStreamer.name)) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
    }

    // وظيفة مشاركة رابط البث مع صورة اللعبة والعنوان
    function shareCurrentStream() {
      const currentLink = `${window.location.origin}${window.location.pathname}?stream=${activeStreamer.channel}`;
      let shareText = `🔴 ${activeStreamer.title}\nانضم للبث المباشر الآن وتفاعل معنا هنا 👇\n${currentLink}`;

      if (navigator.share) {
        navigator.share({
          title: activeStreamer.title,
          text: shareText,
          url: currentLink,
        }).catch((error) => console.log('خطأ في المشاركة', error));
      } else {
        navigator.clipboard.writeText(shareText);
        alert("تم نسخ رابط البث الخاص باللعبة مع رسالة المشاركة! انشره في الجروب الآن 🔥");
      }
    }

    // رابط الإعلان المباشر
    const DIRECT_AD_LINK = "https://www.highrevenuegate.com/YOUR_DIRECT_LINK_ID";
    let hasClickedAd = false;

    function handleSend() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      
      if (text !== "") {
        if (!hasClickedAd && DIRECT_AD_LINK.includes("http")) {
          window.open(DIRECT_AD_LINK, '_blank');
          hasClickedAd = true;
        }

        const commentsList = document.getElementById("commentsList");
        const newComment = document.createElement("div");
        newComment.className = "comment-item";
        newComment.innerHTML = `<span>أنت:</span> ${text}`;
        commentsList.appendChild(newComment);
        commentsList.scrollTop = commentsList.scrollHeight;

        input.value = "";
      }
    }

    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        handleSend();
      }
    });

    // --- كود تدوير الإعلانات العلوية ---
    const adUnits = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let currentIndex = 0;

    function rotateAds() {
      const container = document.getElementById("ad-container");
      if (!container) return;

      container.innerHTML = "";

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = adUnits[currentIndex];
      script.async = true;
      script.setAttribute("data-cfasync", "false");

      container.appendChild(script);

      currentIndex = (currentIndex + 1) % adUnits.length;
    }

    window.addEventListener('load', () => {
      initPage();
      rotateAds();
    });
    setInterval(rotateAds, 20000);
  </script>

</body>
  </html>
