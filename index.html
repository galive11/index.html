<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #ad-container {
      width: 100%;
      height: 80px;
      background: #181a20;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #player-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 80px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- حاوية إعلانات Adsterra -->
  <div id="ad-container">
    <!-- ضع كود إعلان Adsterra الخاص بك هنا -->
  </div>

  <!-- حاوية المشغل -->
  <div id="player-container">
    <iframe 
      id="kick-player" 
      allowfullscreen="true" 
      scrolling="no"
      allow="autoplay; fullscreen; encrypted-media">
    </iframe>
  </div>

  <script>
    // 1. تهيئة وتثبيت تطبيق تلجرام ميني أب
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // 2. قراءة اسم الستريمر الممرر من البوت
    const urlParams = new URLSearchParams(window.location.search);
    const streamer = (urlParams.get('streamer') || '1stremer_1').toLowerCase().trim();

    // 3. تحديد الدومين الدقيق لـ GitHub Pages
    const parentDomain = "galive11.github.io";

    // 4. بناء رابط المشغل بالصيغة المعتمدة لدى Kick
    const playerFrame = document.getElementById('kick-player');
    playerFrame.src = `https://player.kick.com/${streamer}?parent=${parentDomain}&autoplay=true`;
  </script>

</body>
</html>
