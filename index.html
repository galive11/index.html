<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .app-main {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding-bottom: 60px;
    }

    /* 1. منطقة الإعلانات العلوية */
    .ad-section {
      width: 100% !important;
      min-height: 75px !important;
      background-color: #111 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
    }

    /* 🛠️ [زيادة الفراغ]: تم استخدام margin-top صريح وforced */
    .stream-section {
      width: 100% !important;
      background-color: #000 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      margin-top: 35px !important; /* فراغ واضح بين الإعلان والبث */
      margin-bottom: 10px !important;
      padding: 0 10px !important;
    }

    .stream-box {
      width: 100% !important;
      max-width: 480px !important;
      aspect-ratio: 16 / 9 !important;
      background-color: #050505 !important;
      position: relative !important;
    }

    .stream-box iframe {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
    }

    /* 🛠️ [تقليص مساحة التعليقات]: تم تصغير الارتفاع لأقصى حد */
    .chat-section {
      width: 100% !important;
      background-color: #0a0a0a !important;
      border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
      padding: 4px 10px !important;
      height: 40px !important; /* ارتفاع صارم وصغير جداً */
      max-height: 40px !important;
      overflow: hidden !important;
    }

    .comments-box {
      width: 100% !important;
      font-size: 11px !important;
      color: #eee !important;
    }

    .comment-line {
      margin-bottom: 2px !important;
      line-height: 1.2 !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .comment-line strong {
      color: #a29bfe !important;
    }

    /* شريط الكتابة الثابت في أسفل الشاشة */
    .input-section {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 50px !important;
      background-color: #161616 !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 0 12px !important;
      border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
      z-index: 9999 !important;
      padding-bottom: env(safe-area-inset-bottom) !important;
    }

    .input-section input {
      flex: 1 !important;
      height: 34px !important;
      background-color: rgba(255, 255, 255, 0.12) !important;
      border: 1px solid rgba(255, 255, 255, 0.25) !important;
      border-radius: 17px !important;
      padding: 0 12px !important;
      color: #fff !important;
      font-size: 12px !important;
      outline: none !important;
    }

    .input-section input::placeholder {
      color: rgba(255, 255, 255, 0.45) !important;
    }

    .input-section button {
      height: 34px !important;
      background-color: #6c5ce7 !important;
      color: #fff !important;
      border: none !important;
      border-radius: 17px !important;
      padding: 0 15px !important;
      font-size: 12px !important;
      font-weight: bold !important;
      cursor: pointer !important;
    }
  </style>
</head>
<body>

  <div class="app-main">
    
    <!-- 1. الإعلان العلوي -->
    <div class="ad-section" id="ad-box"></div>

    <!-- 2. شاشة البث المباشر (مع فراغ علوي كبير) -->
    <div class="stream-section">
      <div class="stream-box">
        <iframe 
          src="https://player.twitch.tv/?channel=1stremer_1&parent=galive11.github.io" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 3. منطقة التعليقات (مقلصة جداً) -->
    <div class="chat-section">
      <div class="comments-box" id="commentsBox">
        <div class="comment-line"><strong>متابع:</strong> أهلاً بك في البث المباشر!</div>
      </div>
    </div>

  </div>

  <!-- 4. شريط الكتابة الثابت في أسفل الشاشة -->
  <div class="input-section">
    <input type="text" id="userInput" placeholder="اكتب تعليقك أو اسم الستريمر هنا...">
    <button onclick="sendMsg()">إرسال</button>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const DIRECT_AD_LINK = "https://www.highrevenuegate.com/YOUR_DIRECT_LINK_ID";
    let adOpened = false;

    function sendMsg() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();

      if (text !== "") {
        if (!adOpened && DIRECT_AD_LINK.includes("http")) {
          window.open(DIRECT_AD_LINK, '_blank');
          adOpened = true;
        }

        const box = document.getElementById("commentsBox");
        const msg = document.createElement("div");
        msg.className = "comment-line";
        msg.innerHTML = `<strong>أنت:</strong> ${text}`;
        box.appendChild(msg);

        input.value = "";
      }
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMsg();
      }
    });

    const adScripts = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let adIndex = 0;

    function loadNextAd() {
      const adBox = document.getElementById("ad-box");
      if (!adBox) return;

      adBox.innerHTML = "";

      const s = document.createElement("script");
      s.type = "text/javascript";
      s.src = adScripts[adIndex];
      s.async = true;
      s.setAttribute("data-cfasync", "false");

      adBox.appendChild(s);
      adIndex = (adIndex + 1) % adScripts.length;
    }

    window.onload = function() {
      loadNextAd();
      setInterval(loadNextAd, 20000);
    };
  </script>

</body>
</html>
