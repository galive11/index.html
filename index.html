<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* إزالة الهوامش وتثبيت الشاشة بالكامل */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
    }

    /* الحاوية الرئيسية لتقسيم الشاشة عمودياً */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* 1. قسم مشغل تويتش (مصغر ومزاح للأسفل قليلاً لضمان عدم تغطيته بالإعلانات) */
    .stream-container {
      flex: 0 0 auto;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      padding: 12px 16px 4px 16px; /* مساحة أمان علوية وجانبية */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stream-container iframe {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: none;
    }

    /* 2. قسم الشات والتعليقات (في الوسط مع تمرير داخلي) */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #1a1a1a;
    }

    .chat-bubble {
      background-color: rgba(255, 255, 255, 0.07);
      padding: 8px 12px;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13px;
      max-width: 85%;
    }

    /* 3. خانة كتابة التعليقات (فوق شريط الإعلانات مباشرة) */
    .chat-input-bar {
      flex: 0 0 50px;
      background-color: #1e1e1e;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .chat-input-bar input {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .chat-input-bar input::placeholder {
      color: #888;
    }

    .chat-input-bar button {
      background-color: #9146FF; /* لون تويتش المميز */
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0 15px;
      margin-right: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 4. شريط الإعلان السفلي الثابت (مساحة مخصصة وآمنة للـ Social Bar) */
    .ad-zone-dock {
      flex: 0 0 75px;
      width: 100%;
      background-color: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 999;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- 1. شاشة البث المباشر لقناة 1stremer_1 -->
    <div class="stream-container">
      <iframe src="https://player.twitch.tv/?channel=1stremer_1&parent=galive11.github.io" allowfullscreen></iframe>
    </div>

    <!-- 2. قسم الشات والتفاعل -->
    <div class="chat-container" id="chatBox">
      <div class="chat-bubble"><strong>علي:</strong> منورين الشباب، أحلى بث!</div>
      <div class="chat-bubble"><strong>محمد:</strong> الصوت والصورة كلش واضحين</div>
    </div>

    <!-- 3. خانة كتابة التعليق -->
    <div class="chat-input-bar">
      <input type="text" id="messageInput" placeholder="اكتب تعليقاً...">
      <button onclick="sendMessage()">إرسال</button>
    </div>

    <!-- 4. حاوية الإعلان السفلي (تتغير الوحدات الـ 6 فيها آلياً كل 20 ثانية) -->
    <div class="ad-zone-dock" id="ad-container"></div>

  </div>

  <script>
    // دالة إرسال التعليق محلياً
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chatBox = document.getElementById("chatBox");
      
      if (input.value.trim() !== "") {
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.innerHTML = `<strong>أنت:</strong> ${input.value}`;
        chatBox.appendChild(bubble);
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // روابط الـ 6 وحدات Social Bar المستقلة
    const adUnits = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let currentIndex = 0;

    function rotateSocialBar() {
      const container = document.getElementById("ad-container");
      
      if (!container) return;

      // أ) تنظيف الحاوية وحذف السكريبت القديم نهائياً من الـ DOM
      while (container.firstChild) {
        container.removeChild(container.firstChild);
      }

      // ب) إنشاء عنصر script جديد كلياً
      const newScript = document.createElement("script");
      newScript.type = "text/javascript";
      newScript.src = adUnits[currentIndex];
      newScript.async = true;
      newScript.setAttribute("data-cfasync", "false");

      // ج) حقن السكريبت الجديد داخل حاوية الشريط السفلي
      container.appendChild(newScript);

      // د) الانتقال للوحدة التالية (والعودة للأولى تلقائياً بعد اكتمال الـ 6 وحدات)
      currentIndex = (currentIndex + 1) % adUnits.length;
    }

    // تشغيل أول وحدة فور فتح التطبيق
    rotateSocialBar();

    // التبديل الدقيق والمنتظم كل 20 ثانية لتكتمل الدورة في دقيقتين
    setInterval(rotateSocialBar, 20000);
  </script>

</body>
</html>
