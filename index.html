<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #0d0f12; overflow: hidden; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; }

    #top-ad-container {
      width: 100%;
      height: 55px; /* ارتفاع مناسب تماماً لمقاس 320x50 */
      background: #181a20;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid #2b2f3a;
      overflow: hidden;
    }

    #player-container {
      flex: 1;
      width: 100%;
      position: relative;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- إعلان بانر نظيف وثابت في الأعلى بمقاس 320x50 -->
  <div id="top-ad-container">
    <script data-cfasync="false" src="https://pl28414436.profitablecpmrate.com/664c4c28023577c68e9439b9764e7610/invoke.js"></script>
  </div>

  <!-- مشغل البث (Twitch) -->
  <div id="player-container">
    <iframe 
      id="twitch-player" 
      allowfullscreen="true" 
      scrolling="no"
      allow="autoplay; fullscreen; encrypted-media">
    </iframe>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const streamer = (urlParams.get('startapp') || urlParams.get('streamer') || '1stremer_1').toLowerCase().trim();

    const playerFrame = document.getElementById('twitch-player');
    playerFrame.src = `https://player.twitch.tv/?channel=${streamer}&parent=galive11.github.io&parent=telegram.org&parent=web.telegram.org&autoplay=true&muted=false`;
  </script>

</body>
</html>
