<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #ad-container {
      width: 100%;
      height: 80px;
      background: #181a20;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      border-bottom: 1px solid #2b2f3a;
    }
    #player-container {
      flex: 1;
      width: 100%;
      height: calc(100% - 80px);
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- 1. حاوية إعلانات Adsterra -->
  <div id="ad-container">
    <script data-cfasync="false" src="https://bicea.org/14/664c4c28023577c68e9439b9764e7610"></script>
  </div>

  <!-- 2. حاوية مشغل البث (Twitch) -->
  <div id="player-container">
    <iframe 
      id="twitch-player" 
      allowfullscreen="true" 
      scrolling="no"
      allow="autoplay; fullscreen; encrypted-media">
    </iframe>
  </div>

  <script>
    // تهيئة تطبيق تلجرام
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // جلب اسم القناة من الرابط (سواء عبر startapp أو streamer، والاختراضي 1stremer_1)
    const urlParams = new URLSearchParams(window.location.search);
    const streamer = (urlParams.get('startapp') || urlParams.get('streamer') || '1stremer_1').toLowerCase().trim();

    // إعداد مشغل Twitch
    const playerFrame = document.getElementById('twitch-player');
    const embedUrl = `https://player.twitch.tv/?channel=${streamer}&parent=galive11.github.io&parent=telegram.org&parent=web.telegram.org&autoplay=true&muted=false`;
    
    playerFrame.src = embedUrl;
  </script>

</body>
</html>
