<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بثوث مباشرة جيلوكا</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* إزالة الهوامش الافتراضية وثبيت الشاشة */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden; /*منع السكرول الرئيسي للصفحة*/
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background-color: #000; /* خلفية سوداء بالكامل مثل الصورة */
      color: #fff;
    }

    /* الحاوية الرئيسية بنظام Flex عمودي */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* 1. منطقة الإعلانات في الأعلى (Fixed height) */
    .ad-top-dock {
      flex: 0 0 auto;
      width: 100%;
      min-height: 80px; /* الارتفاع الأدنى لمكان الإعلان */
      background-color: rgba(255, 255, 255, 0.05); /* خلفية باهتة جداً لتحديد المكان */
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 2. منطقة البث المباشر - في الوسط (Flex Grow) */
    .stream-container {
      flex: 1 1 auto; /* تأخذ باقي المساحة المتوفرة */
      width: 100%;
      display: flex;
      align-items: center; /* توسيط عمودي */
      justify-content: center; /* توسيط أفقي */
      padding: 20px; /* مسافة أمان حول اللايف */
      background-color: #000;
    }

    /* تنسيق مستطيل شاشة اللايف (الأسود في الصورة الثانية) */
    .stream-content-box {
      width: 100%;
      max-width: 600px; /* أقصى عرض على الشاشات الكبيرة */
      aspect-ratio: 16 / 9; /* الحفاظ على أبعاد الفيديو */
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      position: relative;
    }

    .stream-content-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 3. منطقة التعليقات - أسفل اللايف (Short height) */
    .chat-container {
      flex: 0 0 25%; /* تحديد ارتفاع منطقة التعليقات بـ 25% من الشاشة (أقصر) */
      width: 100%;
      overflow-y: auto; /* سكرول للتعليقات فقط */
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #000; /* الحفاظ على الخلفية السوداء */
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* شكل فقاعة التعليق مثل الصورة */
    .chat-bubble {
      background-color: rgba(255, 255, 255, 0.1); /* رمادي شفاف */
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
      max-width: 90%;
      align-self: flex-start; /* محاذاة لليمين بما أن الاتجاه RTL */
    }

    /* 4. بار الكتابة والإرسال (في الأسفل تماماً) */
    .input-bar {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px 15px;
      background-color: #121212;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: calc(10px + env(safe-area-inset-bottom)); /* دعم آيفون */
    }

    .input-bar input {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 10px 15px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-bar input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    /* زر الإرسال بنفسجي مثل الصورة الأولى */
    .input-bar button {
      background-color: #6c5ce7; 
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- 1. حاوية الإعلانات العلوية - (فوق شاشة البث) -->
    <div class="ad-top-dock" id="ad-container">
      <!-- الإعلانات ستظهر هنا وستدور تلقائياً -->
    </div>

    <!-- 2. منطقة البث المباشر (في الوسط) -->
    <div class="stream-container">
      <div class="stream-content-box">
        <!-- مشغل تويتش الخاص بك -->
        <iframe 
          src="https://player.twitch.tv/?channel=1stremer_1&parent=galive11.github.io" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 3. منطقة التعليقات (قصيرة وأسفل اللايف) -->
    <div class="chat-container" id="chatBox">
      <div class="chat-bubble"><strong>علي:</strong> منورين الشباب، أحلى بث!</div>
      <div class="chat-bubble"><strong>محمد:</strong> الصوت والصورة كلش واضحين</div>
      <!-- التعليقات الجديدة ستضاف هنا -->
    </div>

    <!-- 4. بار الكتابة -->
    <div class="input-bar">
      <input type="text" id="messageInput" placeholder="اكتب تعليقاً...">
      <button onclick="sendMessage()">إرسال</button>
    </div>

  </div>

  <script>
    // تفعيل Telegram WebApp
    const tele = window.Telegram.WebApp;
    tele.ready();
    tele.expand(); // توسيع التطبيق ليشمل كامل الشاشة

    // دالة إرسال التعليق (تجريبية محلياً)
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chatBox = document.getElementById("chatBox");
      
      if (input.value.trim() !== "") {
        // إنشاء فقاعة تعليق جديدة
        const bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.innerHTML = `<strong>أنت:</strong> ${input.value}`;
        
        // إضافة التعليق
        chatBox.appendChild(bubble);
        
        // مسح المدخلات
        input.value = "";
        
        // سكرول لأسفل تلقائياً
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // السماح بالإرسال عبر زر Enter في الكيبورد
    document.getElementById("messageInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    // --- كود تدوير الإعلانات (المُصحح) ---
    // روابط الوحدات الـ 6 الخاصة بك
    const adUnits = [
      "https://bicea.org/14/9f627e7fa7f8974baffcaf9fe5e7dacd",
      "https://bicea.org/14/8718adffd4a541a5e96ca6954e7a4268",
      "https://bicea.org/14/c92568ab59a4638ccc40ccd7f11c756b",
      "https://bicea.org/14/39e0cd3e099ddf4a97307fef2553d0c9",
      "https://bicea.org/14/664c4c28023577c68e9439b9764e7610",
      "https://bicea.org/14/c186556d45572439809220145be80276"
    ];

    let currentIndex = 0;

    function rotateAds() {
      const container = document.getElementById("ad-container");
      if (!container) return;

      // 1. تنظيف الحاوية تماماً
      container.innerHTML = "";

      // 2. إنشاء عنصر script جديد للوحدة الحالية
      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = adUnits[currentIndex];
      script.async = true; // تحميل غير متزامن لعدم حجب تحميل الصفحة
      script.setAttribute("data-cfasync", "false"); // خاص بـ Cloudflare إذا وُجد

      // 3. إضافة السكريبت للحاوية
      container.appendChild(script);

      // 4. تحديث العداد للوحدة التالية (التدوير)
      currentIndex = (currentIndex + 1) % adUnits.length;
      
      //console.log("Ad rotated to: " + currentIndex); // للتعقب عند الحاجة
    }

    // تشغيل أول إعلان فوراً عند التحميل
    window.addEventListener('load', rotateAds);

    // تدوير الإعلانات كل 20 ثانية (20,000 مللي ثانية)
    setInterval(rotateAds, 20000);

  </script>

</body>
</html>
